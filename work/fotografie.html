  <style>
    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* ─── OVERRIDE main.css CONFLICTS ─── */
    /* main.css forces opacity:0 + animation on every section h2 — undo it here */
    section h2,
    section h2.in-view {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
    }
    /* main.css .hero-section::after adds a wave overlay that bleeds over our hero */
    .hero-section::after {
      display: none !important;
    }
    /* main.css body sets background:#F5F5F5 — keep our mint background */
    body {
      background: var(--mint) !important;
    }

    /* ─── TOKENS ─── */
    :root {
      --white:   #F5F5F5;
      --white:#F5F5F5;
      --off-black:#525252;
      --burg:    #6E3B49;
      --mint:    #56686A;
      --teal:    #314A51;
      --mauve:   #B5A19E;
      --cream:   var(--white);
      --bone:    var(--white);
      --parch:   var(--white);
      --text:    var(--off-black);
      --text-40: rgba(45,40,37,.4);
      --text-60: rgba(45,40,37,.6);

      --serif: 'Cormorant Garamond', Georgia, serif;
      --tenor: 'Tenor Sans', sans-serif;

      --gutter: clamp(1.25rem, 4vw, 3rem);
      --gap:    clamp(8px, 4.5vw, 52px);

      /* original scroll-driven easings */
      --power-1-out: linear(0 0%,0.0027 3.64%,0.0106 7.29%,0.0425 14.58%,0.0957 21.87%,0.1701 29.16%,0.2477 35.19%,0.3401 41.23%,0.5982 55.18%,0.7044 61.56%,0.7987 68.28%,0.875 75%,0.9297 81.25%,0.9687 87.5%,0.9922 93.75%,1 100%);
      --power-2-out: linear(0 0%,0.0036 9.62%,0.0185 16.66%,0.0489 23.03%,0.0962 28.86%,0.1705 34.93%,0.269 40.66%,0.3867 45.89%,0.5833 52.95%,0.683 57.05%,0.7829 62.14%,0.8621 67.46%,0.8991 70.68%,0.9299 74.03%,0.9545 77.52%,0.9735 81.21%,0.9865 85%,0.9949 89.15%,1 100%);
      --power-3-out: linear(0 0%,0.0029 13.8%,0.0184 21.9%,0.0339 25.51%,0.0551 28.81%,0.0827 31.88%,0.1168 34.76%,0.1962 39.57%,0.3005 44.02%,0.4084 47.53%,0.6242 53.45%,0.7493 57.93%,0.8495 62.97%,0.8888 65.67%,0.9213 68.51%,0.9629 73.9%,0.9876 80.16%,0.998 87.5%,1 100%);
      --power-4-out: linear(0 0%,0.0012 14.95%,0.0089 22.36%,0.0297 28.43%,0.0668 33.43%,0.0979 36.08%,0.1363 38.55%,0.2373 43.07%,0.3675 47.01%,0.5984 52.15%,0.7121 55.23%,0.8192 59.21%,0.898 63.62%,0.9297 66.23%,0.9546 69.06%,0.9733 72.17%,0.9864 75.67%,0.9982 83.73%,1 100%);
      --sine: linear(0 0%,0.2861 18.47%,0.4829 32.08%,0.6437 44.52%,0.7712 56.07%,0.8722 67.47%,0.9115 73.02%,0.9434 78.49%,0.9682 83.91%,0.9859 89.3%,0.9965 94.66%,1 100%);
    }

    /* ─── BASE ─── */
    html { scroll-behavior: smooth; }

    body {
      background: var(--mint);
      color: var(--text);
      font-family: var(--body);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── SUBTLE GRAIN on light background ─── */

    /* ─── CURSOR ─── */
    #cur-dot {
      position: fixed; top: 0; left: 0;
      width: 6px; height: 6px;
      background: var(--burg); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
    }
    #cur-ring {
      position: fixed; top: 0; left: 0;
      width: 28px; height: 28px;
      border: 1px solid rgba(110,59,73,.28);
      border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: width .5s cubic-bezier(.16,1,.3,1), height .5s cubic-bezier(.16,1,.3,1), border-color .3s;
    }
    #cur-ring.on { width: 52px; height: 52px; border-color: var(--burg); }

    /* ─── PROGRESS BAR ─── */
    #progress {
      position: fixed; top: 0; left: 0; height: 1.5px;
      background: linear-gradient(to right, var(--burg), var(--mauve));
      z-index: 9997; width: 0%; transition: width .08s linear;
    }

    /* ─── HEADER ─── */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 500;
      transition: background .4s ease, box-shadow .4s ease;
    }
    .site-header.scrolled {
      background: rgba(244,239,231,.92);
      backdrop-filter: blur(18px);
      box-shadow: 0 1px 0 rgba(110,59,73,.09);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.35rem var(--gutter);
      max-width: 1440px; margin: 0 auto;
    }
    .logo {
      position: relative; width: 36px; height: 36px;
      display: flex; align-items: center;
    }
    .logo img {
      position: absolute; width: 100%; height: auto;
      transition: opacity .35s ease;
    }
    .logo .logo-b { opacity: 1; }
    .logo .logo-w { opacity: 0; }
    .site-header.scrolled .logo .logo-b { opacity: 0; }
    .site-header.scrolled .logo .logo-w { opacity: 1; }

    .nav-links {
      display: flex; gap: clamp(1.25rem,3vw,2.5rem); align-items: center;
    }
    .nav-link {
      font-size: .65rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--text-60); position: relative; padding: .3rem 0;
      transition: color .3s;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      width: 0; height: 1px; background: var(--burg);
      transition: width .35s cubic-bezier(.16,1,.3,1);
    }
    .nav-link:hover, .nav-link[aria-current] { color: var(--burg); }
    .nav-link:hover::after, .nav-link[aria-current]::after { width: 100%; }

    /* ─── HERO — image-first, almost no text ─── */
    .hero {
      position: relative;
      height: 100vh; min-height: 560px;
      display: grid; place-items: center;
      overflow: hidden;
      background: var(--burg);
      padding-bottom: 0; /* wave-mint würde 20vh hinzufügen → neutralisieren */
    }
    /* Wave-after hinter Hero-Content halten (wave-mint setzt z-index:10 = gleich wie Title/Meta) */
    .hero::after {
      z-index: 2 !important;
    }
    /* delicate concentric arcs */
    .hero-rings {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 1;
    }
    .arc {
      position: absolute; border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      border: 1px solid rgba(110,59,73,.055);
      animation: arcBreath 10s ease-in-out infinite;
    }
    .arc:nth-child(1) { width: 520px; height: 520px; }
    .arc:nth-child(2) { width: 780px; height: 780px; animation-delay: -3s; border-color: rgba(86,104,106,.045); }
    .arc:nth-child(3) { width: 1080px; height: 1080px; animation-delay: -6s; border-color: rgba(181,161,158,.03); }
    @keyframes arcBreath {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50%      { transform: translate(-50%,-50%) scale(1.03); }
    }
    @media (max-width:768px) { .arc:nth-child(3) { display:none; } }

    /* The single title — large, italic, ghost-outlined name underneath */
    .hero-title {
      position: relative; z-index: 10;
      text-align: center;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: titleIn 1.6s cubic-bezier(.16,1,.3,1) .2s forwards;
    }
    .hero-title-main {
      display: block;
      font-family: var(--serif);
      font-size: clamp(5.5rem,14vw,13rem);
      font-weight: 300;
      font-style: italic;
      line-height: .82;
      letter-spacing: -.025em;
      color: var(--white);
    }
    .hero-title-sub {
      display: block;
      margin-top: .9rem;
      font-size: clamp(.55rem,.7vw,.75rem);
      letter-spacing: .5em;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: .8px rgba(110,59,73,.22);
    }
    @keyframes titleIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* minimal bottom meta — just the scroll hint */
    .hero-meta {
      position: absolute; bottom: 2.5rem;
      left: var(--gutter); right: var(--gutter);
      display: flex; justify-content: space-between; align-items: flex-end;
      z-index: 10;
      opacity: 0;
      animation: titleIn 1s cubic-bezier(.16,1,.3,1) 1s forwards;
    }
    .hero-cats {
      display: flex; flex-direction: column; gap: .45rem;
    }
    .hero-cat {
      font-size: .5rem; letter-spacing: .3em; text-transform: uppercase;
      color: var(--text-40); display: flex; align-items: center; gap: .55rem;
    }
    .hero-cat::before {
      content: ''; width: 3px; height: 3px; border-radius: 50%;
      background: var(--burg); opacity: .45;
      flex-shrink: 0;
    }
    .hero-scroll {
      display: flex; flex-direction: column; align-items: flex-end; gap: .45rem;
    }
    .scroll-label {
      font-size: .5rem; letter-spacing: .3em; text-transform: uppercase;
      color: var(--text-40);
    }
    .scroll-line {
      width: 1px; height: 44px; margin-left: auto;
      background: linear-gradient(to bottom, var(--burg), transparent);
      animation: lineBreath 2.6s ease-in-out infinite;
    }
    @keyframes lineBreath {
      0%,100% { opacity: .35; transform: scaleY(1); }
      50%      { opacity: 1;   transform: scaleY(1.12); }
    }

    /* ─── CONTENT WRAP clips the scroll section ─── */
    .content-wrap {
      overflow-x: clip;
      overflow-y: visible;
      background: var(--mint);
      position: relative; z-index: 2;
      padding-bottom: clamp(1.5rem, 4vh, 3rem);
    }

    /* ─── SCROLL-DRIVEN GRID SECTION ─── */
    /* Scroll scroll-driven: min-height 240vh so there's room to animate */
    [data-enhanced='true'] main section:first-of-type {
      min-height: 240vh;
    }

    .content {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      place-items: center;
      align-content: center;
      position: sticky;
      top: 0;
      overflow-x: hidden;
      overflow-y: visible;
      background: var(--mint);
    }

    /* ─── GRID — 5x3 subgrid like reference demo ─── */
    .grid {
      --offset: 0;
      width: 1600px;
      max-width: calc(100% - (2 * var(--gutter)));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gap);
      margin: 0 auto;
      align-content: center;
      position: absolute;
      top: 50%; left: 50%;
      translate: -50% -50%;
      height: min(544px, calc((100vh - 10rem) * 0.8));
    }
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        --offset: -1;
        height: auto;
      }
      .grid > div:nth-of-type(1) { display: none; }
    }

    .grid > .layer {
      display: grid;
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      grid-template-columns: subgrid;
      grid-template-rows: subgrid;
    }

    .grid > div:nth-of-type(1) div:nth-of-type(odd)  { grid-column: 1; }
    .grid > div:nth-of-type(1) div:nth-of-type(even) { grid-column: -2; }
    .grid > div:nth-of-type(2) div:nth-of-type(odd)  { grid-column: calc(2 + var(--offset)); }
    .grid > div:nth-of-type(2) div:nth-of-type(even) { grid-column: calc(-3 - var(--offset)); }
    .grid > div:nth-of-type(3) div { grid-column: calc(3 + var(--offset)); }

    .grid .scaler {
      position: relative;
      grid-area: 2 / calc(3 + var(--offset));
      z-index: 2;
    }

    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      filter: brightness(.88) saturate(.82);
      transition: filter .7s ease, transform .7s cubic-bezier(.16,1,.3,1), box-shadow .6s ease;
    }
    .grid .layer img:hover {
      filter: brightness(1) saturate(1.05);
      transform: scale(1.04) translateY(-5px);
      box-shadow: 0 24px 48px rgba(45,40,37,.13), 0 0 0 1px rgba(110,59,73,.15);
    }
    @media (hover: none) { .grid .layer img:hover { transform: none; filter: brightness(.88) saturate(.82); box-shadow: none; } }

    /* ─── SCALER — center expanding image ─── */
    .scaler {
      z-index: 2;
      width: 100%; height: 100%;
      position: relative;
    }
    .scaler img {
      position: absolute;
      top: 50%; left: 50%;
      translate: -50% -50%;
      object-fit: cover;
      border-radius: 3px;
      width: 100%; height: 100%;
      max-width: none;
      filter: brightness(.9) saturate(.82);
    }

    /* ─── CTA OVERLAY on scaler ─── */
    .scaler-cta {
      position: absolute;
      bottom: clamp(1.2rem, 3vw, 2rem);
      left: 50%;
      translate: -50% 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      pointer-events: none;
      opacity: 0;
      animation: ctaFadeIn 1s cubic-bezier(.16,1,.3,1) 1.8s forwards;
    }
    @keyframes ctaFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .scaler-cta-label {
      font-size: .48rem;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: rgba(244,239,231,.72);
      white-space: nowrap;
    }
    .scaler-cta-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .scaler-cta-arrow {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, rgba(244,239,231,.7), transparent);
      animation: ctaBounce 2.2s ease-in-out infinite;
    }
    .scaler-cta-chevron {
      width: 10px; height: 10px;
      border-right: 1px solid rgba(244,239,231,.6);
      border-bottom: 1px solid rgba(244,239,231,.6);
      transform: rotate(45deg) translateY(-3px);
      animation: ctaBounce 2.2s ease-in-out infinite .15s;
    }
    @keyframes ctaBounce {
      0%, 100% { opacity: .45; transform: translateY(0) rotate(45deg); }
      50%       { opacity: 1;   transform: translateY(5px) rotate(45deg); }
    }
    .scaler-cta-arrow { animation: ctaLineBounce 2.2s ease-in-out infinite; }
    @keyframes ctaLineBounce {
      0%, 100% { opacity: .5; transform: scaleY(1); }
      50%       { opacity: 1;  transform: scaleY(1.15); }
    }

    /* ─── CSS SCROLL-DRIVEN ANIMATIONS ─── */
    @keyframes fade   { 0%, 55% { opacity: 0; } }
    @keyframes reveal { 0%, 30% { scale: 0; } }
    @keyframes scale-x { 0%, 10% { width:  calc(100vw - (2 * var(--gutter))); } }
    @keyframes scale-y { 0%, 10% { height: calc(100vh - (2 * var(--gutter))); } }

    @media (prefers-reduced-motion: no-preference) {
      @supports (animation-timeline: scroll()) and (animation-range: 0 100%) {

        [data-enhanced='true'] main section:first-of-type {
          view-timeline: --runner;
        }

        [data-enhanced='true'][data-center='true'] .scaler img {
          animation-name: scale-x, scale-y;
          animation-fill-mode: both;
          animation-timing-function: var(--power-2-out), var(--power-1-out);
          animation-timeline: --runner, --runner;
          animation-range: entry 100% exit -20%;
        }

        [data-enhanced='true'][data-layers='true'] .grid .layer {
          animation-name: fade, reveal;
          animation-fill-mode: both;
          animation-timeline: --runner, --runner;
          animation-timing-function: var(--sine), var(--power-1-out);
          animation-range: entry 100% exit 0%;
        }

        /* stagger="range" variant */
        [data-enhanced='true'][data-stagger='range'] .grid .layer:nth-of-type(1) { animation-range: entry 100% exit 0%;   }
        [data-enhanced='true'][data-stagger='range'] .grid .layer:nth-of-type(2) { animation-range: entry 100% exit -10%; }
        [data-enhanced='true'][data-stagger='range'] .grid .layer:nth-of-type(3) { animation-range: entry 100% exit -20%; }

        /* stagger="timing" variant */
        [data-enhanced='true'][data-stagger='timing'] .grid .layer:nth-of-type(1) { animation-timing-function: var(--sine), var(--power-1-out); }
        [data-enhanced='true'][data-stagger='timing'] .grid .layer:nth-of-type(2) { animation-timing-function: var(--sine), var(--power-3-out); }
        [data-enhanced='true'][data-stagger='timing'] .grid .layer:nth-of-type(3) { animation-timing-function: var(--sine), var(--power-4-out); }

      }
    }

    /* ─── MARQUEE DIVIDER — after gallery ─── */
    .marquee-wrap {
      overflow: hidden;
      border-top: 1px solid rgba(110,59,73,.09);
      border-bottom: 1px solid rgba(110,59,73,.09);
      background: rgba(86,104,106,.03);
      padding: .8rem 0;
    }
    .marquee-track {
      display: flex; gap: 4.5rem; width: max-content;
      animation: mroll 28s linear infinite;
    }
    .marquee-item {
      font-family: var(--serif); font-size: 1rem; font-style: italic;
      color: var(--mauve); white-space: nowrap;
      display: flex; align-items: center; gap: 4.5rem;
    }
    .marquee-item::before { content: '✦'; font-style: normal; font-size: .48rem; color: var(--burg); opacity: .5; }
    @keyframes mroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ─── ABOUT STRIP ─── */
    .about-strip {
      padding: clamp(5rem,11vw,9rem) var(--gutter);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(3rem,7vw,8rem);
      max-width: 1440px; margin: 0 auto;
      align-items: end;
    }
    @media (max-width: 768px) { .about-strip { grid-template-columns: 1fr; gap: 3rem; } }

    .section-micro {
      font-size: .52rem; letter-spacing: .42em; text-transform: uppercase;
      color: var(--burg); display: flex; align-items: center; gap: .7rem;
      margin-bottom: 1.5rem;
    }
    .section-micro::before { content: ''; width: 18px; height: 1px; background: var(--burg); }

    .about-heading {
      font-family: var(--serif);
      font-size: clamp(2.4rem,5.5vw,4.6rem);
      font-weight: 300; line-height: 1.04;
      letter-spacing: -.02em; color: var(--teal);
    }
    .about-heading em { font-style: italic; color: var(--burg); }

    .about-body {
      font-size: clamp(.85rem,1.25vw,.98rem);
      line-height: 1.88; color: rgba(45,40,37,.52);
      margin-bottom: 1.5rem; max-width: 44ch;
    }

    .stats-row {
      display: flex; gap: 2.8rem; padding-top: 1.8rem;
      border-top: 1px solid rgba(110,59,73,.1);
    }
    .stat { display: flex; flex-direction: column; gap: .25rem; }
    .stat-n {
      font-family: var(--serif); font-size: 2rem; font-weight: 300;
      color: var(--teal); line-height: 1;
    }
    .stat-l {
      font-size: .48rem; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(45,40,37,.32);
    }

    /* ─── CATEGORIES ─── */
    .categories {
      padding: clamp(3rem,7vw,6rem) var(--gutter);
      max-width: 1440px; margin: 0 auto;
    }
    .cat-head {
      display: flex; align-items: center; gap: 2rem;
      margin-bottom: clamp(2rem,5vw,3.5rem);
    }
    .cat-head h2 {
      font-family: var(--serif); font-size: clamp(1.5rem,3vw,2.4rem);
      font-weight: 300; font-style: italic; color: var (--teal); white-space: nowrap;
    }
    .cat-rule { flex: 1; height: 1px; background: linear-gradient(to right, rgba(110,59,73,.16), transparent); }

    .cats {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5px;
    }
    @media (max-width: 640px) { .cats { grid-template-columns: 1fr; } }

    .cat {
      position: relative; padding: 1.75rem 2.25rem;
      background: rgba(86,104,106,.025);
      border: 1px solid rgba(110,59,73,.065);
      overflow: hidden; cursor: none;
      transition: background .4s, border-color .4s;
    }
    .cat::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 2px; height: 0; background: var (--burg);
      transition: height .55s cubic-bezier(.16,1,.3,1);
    }
    .cat:hover::before { height: 100%; }
    .cat:hover { background: rgba(110,59,73,.04); border-color: rgba(110,59,73,.18); }
    .cat-n {
      font-family: var(--serif); font-size: 2.8rem; font-weight: 300;
      color: rgba(110,59,73,.06); line-height: 1; margin-bottom: .8rem;
    }
    .cat-t {
      font-family: var(--serif); font-size: 1.3rem; font-style: italic;
      color: var(--teal); margin-bottom: .6rem;
    }
    .cat-d { font-size: .78rem; line-height: 1.75; color: rgba(45,40,37,.5); }
    .cat-arr {
      position: absolute; bottom: 1.6rem; right: 1.6rem;
      width: 28px; height: 28px;
      border: 1px solid rgba(110,59,73,.12); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: all .4s cubic-bezier(.16,1,.3,1);
    }
    .cat:hover .cat-arr { opacity: 1; border-color: var(--burg); transform: rotate(-45deg); }
    .cat-arr svg { width: 10px; height: 10px; stroke: var(--burg); }

    /* ─── CTA ─── */
    .cta {
      padding: clamp(5rem,12vw,10rem) var(--gutter);
      text-align: center; max-width: 1440px; margin: 0 auto;
    }
    .cta-lbl {
      font-size: .5rem; letter-spacing: .42em; text-transform: uppercase;
      color: rgba(45,40,37,.32); margin-bottom: 1.8rem;
    }
    .cta-h {
      font-family: var(--serif);
      font-size: clamp(3rem,7.5vw,7.5rem);
      font-weight: 300; line-height: .88;
      color: var(--teal); margin-bottom: 2.8rem;
    }
    .cta-h em { font-style: italic; color: var(--burg); }
    .cta-btns { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: .7rem;
      padding: .9rem 2.2rem;
      font-size: .6rem; letter-spacing: .22em; text-transform: uppercase;
      transition: all .4s cubic-bezier(.16,1,.3,1); cursor: none;
    }
    .btn-p { background: var(--burg); color: var(--cream); }
    .btn-p:hover { background: #8a4d5f; transform: translateY(-3px); box-shadow: 0 14px 32px rgba(110,59,73,.22); }
    .btn-g { border: 1px solid rgba(110,59,73,.2); color: var(--text-60); }
    .btn-g:hover { border-color: var(--burg); color: var(--burg); transform: translateY(-3px); }

    /* ─── DIVIDER ─── */
    .divider {
      height: 1px; margin: 0 var(--gutter);
      background: linear-gradient(to right, transparent, rgba(110,59,73,.1) 30%, rgba(110,59,73,.1) 70%, transparent);
    }


    /* ─── SCROLL REVEAL ─── */
    .js-up { opacity: 0; transform: translateY(36px); }
  </style>

<script>
  gsap.registerPlugin(ScrollTrigger);

  /* ── CURSOR ── */
  const dot  = document.getElementById('cur-dot');
  const ring = document.getElementById('cur-ring');
  let mx=0, my=0, rx=0, ry=0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
  });
  (function raf() {
    rx += (mx - rx) * .12;
    ry += (my - ry) * .12;
    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    requestAnimationFrame(raf);
  })();

  document.querySelectorAll('a, button, .cat, img').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('on'));
    el.addEventListener('mouseleave', () => ring.classList.remove('on'));
  });

  /* ── PROGRESS ── */
  const pb = document.getElementById('progress');
  window.addEventListener('scroll', () => {
    const s = document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    pb.style.width = (s / h * 100) + '%';
  }, { passive: true });

  /* ── HEADER SCROLL STATE ── */
  const hdr = document.getElementById('site-header');
  window.addEventListener('scroll', () => {
    hdr.classList.toggle('scrolled', window.scrollY > 80);
  }, { passive: true });

  /* ── GALLERY: GSAP FALLBACK (browsers without scroll-driven) ── */
  const hasScrollDriven = CSS.supports(
    '(animation-timeline: view()) and (animation-range: 0 100%)'
  );

  if (!hasScrollDriven) {
    // scaler image expands from viewport-fill to its natural grid size
    gsap.timeline({
      scrollTrigger: {
        trigger: 'main section:first-of-type',
        start: 'top -10%', end: 'bottom 80%', scrub: true
      }
    })
    .from('.scaler img', { height: window.innerHeight - 32, ease: 'power1.inOut' }, 0)
    .from('.scaler img', { width:  window.innerWidth  - 32, ease: 'power2.inOut' }, 0);

    // layers stagger in
    gsap.timeline({
      scrollTrigger: {
        trigger: 'main section:first-of-type',
        start: 'top -40%', end: 'bottom bottom', scrub: true
      }
    })
    .from('.layer:nth-of-type(1)', { opacity: 0, scale: 0, ease: 'power1.inOut' }, 0)
    .from('.layer:nth-of-type(2)', { opacity: 0, scale: 0, ease: 'power3.inOut' }, 0)
    .from('.layer:nth-of-type(3)', { opacity: 0, scale: 0, ease: 'power4.inOut' }, 0);
  }

  /* ── SCROLL REVEALS ── */
  gsap.utils.toArray('.js-up').forEach(el => {
    gsap.fromTo(el,
      { opacity: 0, y: 36 },
      { opacity: 1, y: 0, duration: 1.1, ease: 'power3.out',
        delay: parseFloat(getComputedStyle(el).getPropertyValue('--d') || 0),
        scrollTrigger: { trigger: el, start: 'top 87%', toggleActions: 'play none none none' }
      }
    );
  });

  gsap.utils.toArray('.cat').forEach((el, i) => {
    gsap.fromTo(el,
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: .8, ease: 'power3.out', delay: i * .08,
        scrollTrigger: { trigger: '.cats', start: 'top 87%', toggleActions: 'play none none none' }
      }
    );
  });

  gsap.utils.toArray('.stat').forEach((el, i) => {
    gsap.fromTo(el,
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: .65, ease: 'power3.out', delay: i * .12,
        scrollTrigger: { trigger: '.stats-row', start: 'top 91%', toggleActions: 'play none none none' }
      }
    );
  });

  /* ── HERO SCROLL ANIMATION (Fotografie) ── */
  gsap.timeline({
    scrollTrigger: {
      trigger: '.hero',
      start: 'top top',
      end: 'bottom top',
      scrub: true
    }
  })
  .to('.hero-title', {
    yPercent: -15,
    opacity: 0.1,
    ease: 'none'
  }, 0)
  .to('.hero-meta', {
    yPercent: -30,
    opacity: 0,
    ease: 'none'
  }, 0);

  window.addEventListener('beforeunload', () => ScrollTrigger.killAll());
</script>
