<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmetterlings-Galerie — Physik & Copy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --dg: #314A51; --mint: #56686A; --burg: #6E3B49; 
            --mauve: #B5A19E; --blush: #D4B9B5; --cream: #F5F0EA; 
            --off: #525252;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--cream);
            color: var(--off);
            overflow-x: hidden;
        }

        header { text-align: center; padding: 60px 20px 40px; }
        header h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-weight: 300; 
            font-size: clamp(24px, 4vw, 42px); 
            color: var(--dg);
            letter-spacing: 0.05em;
        }
        .divider { width: 40px; height: 1px; background: var(--burg); margin: 15px auto; }
        header p { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--mauve); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            max-width: 1200px;
            margin: 0 auto 100px;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 4px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .card.dark { background: #1e2a2d; color: var(--cream); }

        /* PHYSIK-KERN */
        .butterfly-container {
            position: relative;
            perspective: 1000px;
            transform-style: preserve-3d;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .butterfly {
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            position: relative;
        }

        .wing-l { transform-origin: right center; transform-style: preserve-3d; margin-right: -1px; }
        .wing-r { transform-origin: left center; transform-style: preserve-3d; margin-left: -1px; }

        .body-center {
            position: absolute;
            z-index: 10;
            transform: translateZ(5px);
        }

        /* KEYFRAMES */
        @keyframes flap-l-std { 0% { transform: rotateY(-60deg) rotateZ(-5deg); } 100% { transform: rotateY(40deg) rotateZ(5deg); } }
        @keyframes flap-r-std { 0% { transform: rotateY(60deg) rotateZ(5deg); } 100% { transform: rotateY(-40deg) rotateZ(-5deg); } }
        
        @keyframes flap-l-fast { 0% { transform: rotateY(-70deg) translateZ(2px); } 100% { transform: rotateY(20deg) translateZ(-2px); } }
        @keyframes flap-r-fast { 0% { transform: rotateY(70deg) translateZ(2px); } 100% { transform: rotateY(-20deg) translateZ(-2px); } }

        @keyframes flap-l-glide { 0% { transform: rotateY(-15deg); } 100% { transform: rotateY(5deg); } }
        @keyframes flap-r-glide { 0% { transform: rotateY(15deg); } 100% { transform: rotateY(-5deg); } }

        @keyframes flap-l-heavy { 0% { transform: rotateY(-80deg) rotateX(-10deg); } 100% { transform: rotateY(50deg) rotateX(10deg); } }
        @keyframes flap-r-heavy { 0% { transform: rotateY(80deg) rotateX(-10deg); } 100% { transform: rotateY(-50deg) rotateX(10deg); } }

        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* ZUWEISUNG */
        .f-std .wing-l { animation: flap-l-std 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate; }
        .f-std .wing-r { animation: flap-r-std 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate; }
        .f-fast .wing-l { animation: flap-l-fast 0.2s ease-in-out infinite alternate; }
        .f-fast .wing-r { animation: flap-r-fast 0.2s ease-in-out infinite alternate; }
        .f-glide .wing-l { animation: flap-l-glide 4s ease-in-out infinite alternate; }
        .f-glide .wing-r { animation: flap-r-glide 4s ease-in-out infinite alternate; }
        .f-heavy .wing-l { animation: flap-l-heavy 2.8s ease-in-out infinite alternate; }
        .f-heavy .wing-r { animation: flap-r-heavy 2.8s ease-in-out infinite alternate; }

        .bob-std { animation: bob 3s ease-in-out infinite; }
        .bob-fast { animation: bob 0.8s ease-in-out infinite; }
        .bob-slow { animation: bob 5s ease-in-out infinite; }

        /* UI ELEMENTS */
        .label { margin-top: 30px; text-align: center; }
        .label h3 { font-size: 14px; letter-spacing: 1px; color: var(--dg); font-weight: 400; }
        .label p { font-size: 9px; text-transform: uppercase; color: var(--mauve); margin-top: 5px; }
        .dark .label h3 { color: var(--blush); }

        .copy-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--mauve);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background: var(--dg);
            color: #fff;
            border-color: var(--dg);
        }
        .dark .copy-btn { border-color: rgba(255,255,255,0.1); }
        .dark .copy-btn:hover { background: var(--blush); color: var(--dg); }

        /* Success Message */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dg);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        svg { display: block; overflow: visible; }
    </style>
</head>
<body>

<header>
    <h1>Schmetterlings-Physik</h1>
    <div class="divider"></div>
    <p>Interaktive Galerie & Code Export</p>
</header>

<div class="grid">

    <!-- 1. WALDPORTIER -->
    <div class="card" data-type="std">
        <div class="butterfly-container bob-std">
            <div class="butterfly f-std">
                <div class="wing-l">
                    <svg width="80" height="100" viewBox="0 0 80 100">
                        <path d="M80 50 C60 20 10 10 5 30 C0 50 40 60 80 50 Z" fill="rgba(110,59,73,0.3)" stroke="#6E3B49" stroke-width="1"/>
                        <path d="M80 50 C60 80 20 95 10 85 C0 75 40 65 80 50 Z" fill="rgba(181,161,158,0.2)" stroke="#B5A19E" stroke-width="1"/>
                    </svg>
                </div>
                <div class="body-center">
                    <ellipse cx="0" cy="0" rx="3" ry="18" fill="#314A51" />
                </div>
                <div class="wing-r">
                    <svg width="80" height="100" viewBox="0 0 80 100">
                        <path d="M0 50 C20 20 70 10 75 30 C80 50 40 60 0 50 Z" fill="rgba(110,59,73,0.3)" stroke="#6E3B49" stroke-width="1"/>
                        <path d="M0 50 C20 80 60 95 70 85 C80 75 40 65 0 50 Z" fill="rgba(181,161,158,0.2)" stroke="#B5A19E" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="label">
            <h3>Waldportier</h3>
            <p>Rhythmisch · Klassisch</p>
        </div>
        <button class="copy-btn" onclick="copyButterfly(this)">Code kopieren</button>
    </div>

    <!-- 2. BLÄULING -->
    <div class="card" data-type="fast">
        <div class="butterfly-container bob-fast">
            <div class="butterfly f-fast">
                <div class="wing-l">
                    <svg width="70" height="90" viewBox="0 0 70 90">
                        <path d="M70 45 C50 10 10 10 5 25 C0 40 40 50 70 45 Z" fill="rgba(86,104,106,0.4)" stroke="#56686A" stroke-width="1.5"/>
                        <path d="M70 45 C50 75 20 85 10 75 C0 65 40 55 70 45 Z" fill="rgba(49,74,81,0.2)" stroke="#314A51" stroke-width="1"/>
                    </svg>
                </div>
                <div class="body-center">
                    <ellipse cx="0" cy="0" rx="2" ry="15" fill="#1a1a1a" />
                </div>
                <div class="wing-r">
                    <svg width="70" height="90" viewBox="0 0 70 90">
                        <path d="M0 45 C20 10 60 10 65 25 C70 40 30 50 0 45 Z" fill="rgba(86,104,106,0.4)" stroke="#56686A" stroke-width="1.5"/>
                        <path d="M0 45 C20 75 50 85 60 75 C70 65 30 55 0 45 Z" fill="rgba(49,74,81,0.2)" stroke="#314A51" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="label">
            <h3>Bläuling</h3>
            <p>Hektisch · Hochfrequent</p>
        </div>
        <button class="copy-btn" onclick="copyButterfly(this)">Code kopieren</button>
    </div>

    <!-- 3. SEGELFALTER -->
    <div class="card" data-type="glide">
        <div class="butterfly-container bob-slow">
            <div class="butterfly f-glide">
                <div class="wing-l">
                    <svg width="100" height="120" viewBox="0 0 100 120">
                        <path d="M100 60 C70 10 10 10 5 35 C0 60 60 70 100 60 Z" fill="rgba(212,185,181,0.3)" stroke="#D4B9B5" stroke-width="0.8"/>
                        <path d="M100 60 C80 110 20 120 10 100 C0 80 60 80 100 60 Z" fill="rgba(181,161,158,0.15)" stroke="#B5A19E" stroke-width="0.8"/>
                    </svg>
                </div>
                <div class="body-center">
                    <ellipse cx="0" cy="0" rx="3.5" ry="22" fill="#6E3B49" />
                </div>
                <div class="wing-r">
                    <svg width="100" height="120" viewBox="0 0 100 120">
                        <path d="M0 60 C30 10 90 10 95 35 C100 60 40 70 0 60 Z" fill="rgba(212,185,181,0.3)" stroke="#D4B9B5" stroke-width="0.8"/>
                        <path d="M0 60 C20 110 80 120 90 100 C100 80 40 80 0 60 Z" fill="rgba(181,161,158,0.15)" stroke="#B5A19E" stroke-width="0.8"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="label">
            <h3>Segelfalter</h3>
            <p>Ereignisarm · Gleitend</p>
        </div>
        <button class="copy-btn" onclick="copyButterfly(this)">Code kopieren</button>
    </div>

    <!-- 4. NACHTPFAUENAUGE -->
    <div class="card dark" data-type="heavy">
        <div class="butterfly-container bob-std">
            <div class="butterfly f-heavy">
                <div class="wing-l">
                    <svg width="90" height="110" viewBox="0 0 90 110">
                        <path d="M90 55 C60 0 10 20 5 45 C0 70 40 80 90 55 Z" fill="rgba(245,240,234,0.1)" stroke="rgba(245,240,234,0.4)" stroke-width="1.2"/>
                        <path d="M90 55 C60 100 20 110 10 95 C0 80 40 70 90 55 Z" fill="rgba(245,240,234,0.05)" stroke="rgba(245,240,234,0.2)" stroke-width="1"/>
                    </svg>
                </div>
                <div class="body-center">
                    <ellipse cx="0" cy="0" rx="4.5" ry="20" fill="#fff" opacity="0.9" />
                </div>
                <div class="wing-r">
                    <svg width="90" height="110" viewBox="0 0 90 110">
                        <path d="M0 55 C30 0 80 20 85 45 C90 70 50 80 0 55 Z" fill="rgba(245,240,234,0.1)" stroke="rgba(245,240,234,0.4)" stroke-width="1.2"/>
                        <path d="M0 55 C30 100 70 110 80 95 C90 80 50 70 0 55 Z" fill="rgba(245,240,234,0.05)" stroke="rgba(245,240,234,0.2)" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="label">
            <h3>Nachtpfauenauge</h3>
            <p>Schwerfällig · Tiefschlag</p>
        </div>
        <button class="copy-btn" onclick="copyButterfly(this)">Code kopieren</button>
    </div>

</div>

<div id="toast">Code in Zwischenablage kopiert!</div>

<script>
    function copyButterfly(btn) {
        const card = btn.closest('.card');
        const type = card.getAttribute('data-type');
        const container = card.querySelector('.butterfly-container').cloneNode(true);
        
        // CSS Mapping für den Export
        const animations = {
            'std': { flap: 'std', bob: 'bob-std', speed: '1.4s' },
            'fast': { flap: 'fast', bob: 'bob-fast', speed: '0.2s' },
            'glide': { flap: 'glide', bob: 'bob-slow', speed: '4s' },
            'heavy': { flap: 'heavy', bob: 'bob-std', speed: '2.8s' }
        };

        const config = animations[type];
        
        // Baue das Code Snippet zusammen
        const htmlContent = container.outerHTML.trim();
        const cssContent = `
<style>
    .butterfly-container { position: relative; perspective: 1000px; transform-style: preserve-3d; height: 120px; display: flex; align-items: center; justify-content: center; animation: bob 3s ease-in-out infinite; }
    .butterfly { display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; position: relative; }
    .wing-l { transform-origin: right center; transform-style: preserve-3d; margin-right: -1px; animation: flap-l-${config.flap} ${config.speed} ease-in-out infinite alternate; }
    .wing-r { transform-origin: left center; transform-style: preserve-3d; margin-left: -1px; animation: flap-r-${config.flap} ${config.speed} ease-in-out infinite alternate; }
    .body-center { position: absolute; z-index: 10; transform: translateZ(5px); }
    
    @keyframes flap-l-${config.flap} { 0% { transform: rotateY(-60deg); } 100% { transform: rotateY(40deg); } }
    @keyframes flap-r-${config.flap} { 0% { transform: rotateY(60deg); } 100% { transform: rotateY(-40deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>`.trim();

        const fullCode = `<!-- Schmetterling Export -->\n${cssContent}\n\n${htmlContent}`;

        // Kopieren
        const textArea = document.createElement("textarea");
        textArea.value = fullCode;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast();
        } catch (err) {
            console.error('Fehler beim Kopieren', err);
        }
        document.body.removeChild(textArea);
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2000);
    }
</script>

</body>
</html>
