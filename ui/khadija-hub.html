<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khadija — Component Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=tenor:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5F0EA;
  --white:#FFFFFF;
  --dark:#2D2020;
  --dg:#314A51;
  --burg:#6E3B49;
  --mauve:#B5A19E;
  --blush:#D4B9B5;
  --mint:#56686A;
  --off:#525252;
  --ease:cubic-bezier(.16,1,.3,1);
}

html,body{height:100%;margin:0;padding:0;font-family:'Outfit',sans-serif;overflow:hidden}

body{
  background:var(--cream);
  color:var(--dark);
  display:grid;
  grid-template-columns:280px 1fr;
  grid-template-rows:1fr;
}

/* ════ SIDEBAR ════ */
.sidebar{
  background:var(--white);
  border-right:1px solid rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

.sidebar-head{
  padding:20px 18px;
  border-bottom:1px solid rgba(0,0,0,.05);
  flex-shrink:0;
}

.sidebar-head h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:20px;
  letter-spacing:.05em;
  color:var(--dg);
  margin:0;
}

.sidebar-head p{
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mauve);
  margin:3px 0 0 0;
}

.search-wrap{
  padding:10px 12px;
  border-bottom:1px solid rgba(0,0,0,.04);
  flex-shrink:0;
}

.search{
  width:100%;
  padding:8px 12px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:6px;
  font-size:12px;
  background:var(--cream);
  color:var(--dark);
  outline:none;
}

.search:focus{border-color:var(--burg)}

.nav{
  flex:1;
  overflow-y:auto;
  padding:8px;
}

.cat-header{
  font-size:10px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--dark);
  padding:12px 10px;
  cursor:pointer;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  user-select:none;
  transition:background .2s;
}

.cat-header:hover{background:rgba(0,0,0,.03)}

.cat-header.open{background:rgba(110,59,73,.08)}

.cat-arrow{
  font-size:10px;
  transition:transform .3s;
}

.cat-header.open .cat-arrow{transform:rotate(180deg)}

.cat-items{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s var(--ease);
}

.cat-header.open + .cat-items{max-height:500px}

.nav-item{
  padding:8px 12px;
  margin:2px 0;
  border-radius:6px;
  font-size:12px;
  color:var(--off);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:all .15s;
}

.nav-item:hover{
  background:rgba(110,59,73,.06);
  color:var(--burg);
}

.nav-item.active{
  background:var(--dark);
  color:#fff;
  font-weight:500;
}

.nav-item-dot{
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--mauve);
  flex-shrink:0;
}

.nav-item.active .nav-item-dot{background:#fff}

/* ════ MAIN AREA ════ */
.main-area{
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  background:#fafafa;
}

/* ════ STAGE VIEW ════ */
.stage{
  display:none;
  flex-direction:column;
  flex:1;
  overflow:hidden;
}

.stage.show{display:flex}

.stage-topbar{
  padding:12px 20px;
  border-bottom:1px solid rgba(0,0,0,.06);
  background:var(--white);
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.stage-back{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--mauve);
  font-size:18px;
  padding:4px 8px;
}

.stage-name{
  font-family:'Cormorant Garamond',serif;
  font-size:16px;
  font-style:italic;
  color:var(--dg);
  flex:1;
}

.stage-tag{
  font-size:8px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--mauve);
  border:1px solid rgba(181,161,158,.4);
  padding:3px 10px;
  border-radius:99px;
}

.preview-area{
  flex:1;
  position:relative;
  background-image:radial-gradient(rgba(181,161,158,.22) 1px,transparent 1px);
  background-size:22px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.preview-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .3s var(--ease);
}

.scale-row{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:3px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(0,0,0,.07);
  border-radius:8px;
  padding:3px;
}

.scale-btn{
  font-size:10px;
  padding:4px 10px;
  border:none;
  border-radius:5px;
  background:transparent;
  color:var(--off);
  cursor:pointer;
  transition:all .18s;
}

.scale-btn.active{
  background:var(--dark);
  color:#fff;
}

.bg-row{
  position:absolute;
  bottom:12px;
  right:14px;
  display:flex;
  gap:5px;
}

.bg-swatch{
  width:18px;
  height:18px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
  transition:border-color .2s;
}

.bg-swatch.active{border-color:var(--burg)}

/* ════ SHOWCASE VIEW ════ */
.showcase{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:40px;
  overflow-y:auto;
  flex:1;
}

.showcase.hide{display:none}

.showcase-card{
  background:var(--white);
  border:1px solid rgba(0,0,0,.05);
  border-radius:12px;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s;
  min-height:160px;
}

.showcase-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  border-color:var(--burg);
}

.showcase-preview{
  transform:scale(0.6);
  pointer-events:none;
  margin-bottom:8px;
}

.showcase-label{
  font-size:11px;
  color:var(--mauve);
  text-align:center;
  font-weight:500;
}

/* ════ SETTINGS ════ */
.settings-area{
  background:var(--white);
  border-top:1px solid rgba(0,0,0,.06);
  padding:20px 40px 40px;
  flex-shrink:0;
  max-height:35vh;
  overflow-y:auto;
}

.settings-tabs{
  display:flex;
  gap:24px;
  border-bottom:1px solid rgba(0,0,0,.08);
  margin-bottom:20px;
  flex-wrap:wrap;
}

.settings-tab{
  padding:8px 0;
  font-size:11px;
  font-weight:600;
  letter-spacing:.05em;
  color:var(--off);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;
}

.settings-tab:hover{color:var(--burg)}

.settings-tab.active{
  color:var(--burg);
  border-bottom-color:var(--burg);
}

.settings-pane{
  display:none;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.settings-pane.show{display:grid}

.setting-row{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.setting-row label{
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--mauve);
}

.setting-row input{
  padding:8px 10px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:4px;
  font-size:12px;
  font-family:'Outfit',sans-serif;
}

.setting-row input:focus{
  outline:none;
  border-color:var(--burg);
}

@media (max-width:1024px){
  body{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-head">
    <h1>Khadija Hub</h1>
    <p>Design System</p>
  </div>
  <div class="search-wrap">
    <input class="search" type="text" placeholder="Suchen...">
  </div>
  <nav class="nav" id="navContainer"></nav>
</aside>

<!-- MAIN AREA -->
<div class="main-area">
  <!-- SHOWCASE VIEW (Standard) -->
  <div class="showcase" id="showcaseGrid"></div>

  <!-- STAGE VIEW (Detail) -->
  <div class="stage" id="stageView">
    <div class="stage-topbar">
      <button class="stage-back" id="backBtn">←</button>
      <span class="stage-name" id="stageName">Komponente</span>
      <span class="stage-tag" id="stageTag">Tag</span>
    </div>
    <div class="preview-area" id="previewArea">
      <div class="preview-inner" id="previewInner"></div>
      <div class="scale-row">
        <button class="scale-btn active" data-scale="1">100%</button>
        <button class="scale-btn" data-scale="0.75">75%</button>
        <button class="scale-btn" data-scale="1.5">150%</button>
        <button class="scale-btn" data-scale="2">200%</button>
      </div>
      <div class="bg-row">
        <div class="bg-swatch active" data-bg="#fafafa" style="background:#fafafa; border:1.5px solid #ccc"></div>
        <div class="bg-swatch" data-bg="#F5F0EA" style="background:#F5F0EA"></div>
        <div class="bg-swatch" data-bg="#314A51" style="background:#314A51"></div>
        <div class="bg-swatch" data-bg="#2D2020" style="background:#2D2020"></div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-area" id="settingsArea">
    <div class="settings-tabs" id="settingsTabs"></div>
    <div id="settingsPanes"></div>
  </div>
</div>

<script>
const components = {
  'hero-flower':{name:'Rotierende Blume',category:'Hero',props:{size:80},html:'<div style="position:relative;display:flex;align-items:center;justify-content:center;width:80px;height:80px"><svg style="animation:rot 16s linear infinite" viewBox="0 0 80 80" fill="none" width="80" height="80"><circle cx="40" cy="40" r="35" stroke="rgba(181,161,158,.2)" stroke-width="0.8"/><ellipse cx="40" cy="40" rx="5" ry="18" stroke="rgba(181,161,158,.5)" stroke-width="0.8"/><ellipse cx="40" cy="40" rx="5" ry="18" stroke="rgba(181,161,158,.5)" stroke-width="0.8" transform="rotate(60 40 40)"/><ellipse cx="40" cy="40" rx="5" ry="18" stroke="rgba(181,161,158,.5)" stroke-width="0.8" transform="rotate(120 40 40)"/><circle cx="40" cy="40" r="4" fill="rgba(110,59,73,.6)"/></svg></div>',css:'@keyframes rot{to{transform:rotate(360deg)}}'},
  'triple-rings':{name:'Triple Ringe',category:'Hero',props:{size:80},html:'<div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center"><div style="position:absolute;border-radius:50%;border:1px solid rgba(110,59,73,.4);width:60%;height:60%;animation:breath 4s ease-in-out infinite"></div><div style="position:absolute;border-radius:50%;border:1px solid rgba(110,59,73,.4);width:80%;height:40%;animation:breath 4s ease-in-out infinite 0.5s"></div></div>',css:'@keyframes breath{0%,100%{opacity:0.2}50%{opacity:0.6}}'},
  'bf-glasswing':{name:'Glasswing Butterfly',category:'Butterfly',props:{size:100},html:'<svg width="100" height="100" viewBox="0 0 140 120" overflow="visible"><g style="transform-origin:center 55%"><path d="M67 57 C60 44 40 18 20 16 C6 15 2 30 8 46 C14 60 42 68 67 64Z" fill="rgba(181,161,158,.18)" stroke="rgba(181,161,158,.7)" stroke-width="1.4"/><path d="M67 64 C52 74 28 86 16 80 C7 75 12 62 28 60 C44 58 60 62 67 64Z" fill="rgba(212,185,181,.22)" stroke="rgba(212,185,181,.6)" stroke-width="1.2"/></g><g style="transform-origin:center 55%"><path d="M73 57 C80 44 100 18 120 16 C134 15 138 30 132 46 C126 60 98 68 73 64Z" fill="rgba(181,161,158,.18)" stroke="rgba(181,161,158,.7)" stroke-width="1.4"/><path d="M73 64 C88 74 112 86 124 80 C133 75 128 62 112 60 C96 58 80 62 73 64Z" fill="rgba(212,185,181,.22)" stroke="rgba(212,185,181,.6)" stroke-width="1.2"/></g><ellipse cx="70" cy="62" rx="2.8" ry="22" fill="rgba(110,59,73,.8)"/><circle cx="70" cy="41" r="4.5" fill="rgba(110,59,73,.8)"/></svg>',css:''},
  'boho-arch':{name:'Rainbow Arch',category:'Boho',props:{size:100},html:'<svg width="100" height="100" viewBox="0 0 100 100"><path d="M 20 80 Q 50 20 80 80" fill="none" stroke="rgba(181,161,158,.5)" stroke-width="2" stroke-linecap="round"/><path d="M 25 80 Q 50 35 75 80" fill="none" stroke="rgba(212,185,181,.4)" stroke-width="2" stroke-linecap="round"/><path d="M 30 80 Q 50 50 70 80" fill="none" stroke="rgba(110,59,73,.3)" stroke-width="2" stroke-linecap="round"/></svg>',css:''},
  'fl-peony':{name:'Pfingstrose',category:'Flora',props:{size:100},html:'<svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="rgba(212,185,181,.3)"/><circle cx="40" cy="40" r="15" fill="rgba(181,161,158,.4)"/><circle cx="60" cy="40" r="15" fill="rgba(181,161,158,.4)"/><circle cx="40" cy="60" r="15" fill="rgba(181,161,158,.4)"/><circle cx="60" cy="60" r="15" fill="rgba(181,161,158,.4)"/><circle cx="50" cy="50" r="8" fill="rgba(110,59,73,.6)"/></svg>',css:''},
  'btn-fill':{name:'Fill Reveal Button',category:'Buttons',props:{size:120,text:'Button'},html:'<button style="padding:12px 32px;border:1px solid rgba(110,59,73,.4);background:rgba(110,59,73,.1);color:rgba(110,59,73,.8);border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s">Button</button>',css:''}
};

const categories = {};
Object.values(components).forEach(c => {
  if(!categories[c.category]) categories[c.category] = [];
  categories[c.category].push(c);
});

let current = null;
let state = {};

function renderNav() {
  const nav = document.getElementById('navContainer');
  nav.innerHTML = '';
  
  Object.entries(categories).forEach(([cat, items]) => {
    const catHeader = document.createElement('div');
    catHeader.className = 'cat-header';
    catHeader.innerHTML = `<span>${cat}</span><span class="cat-arrow">↓</span>`;
    catHeader.onclick = () => {
      catHeader.classList.toggle('open');
      itemsGroup.classList.toggle('open');
      if(catHeader.classList.contains('open')) showShowcase(cat);
    };

    const itemsGroup = document.createElement('div');
    itemsGroup.className = 'cat-items';

    items.forEach(item => {
      const itemEl = document.createElement('div');
      itemEl.className = 'nav-item';
      itemEl.innerHTML = `<span class="nav-item-dot"></span>${item.name}`;
      itemEl.onclick = () => selectItem(item.name);
      itemsGroup.appendChild(itemEl);
    });

    nav.appendChild(catHeader);
    nav.appendChild(itemsGroup);
  });
}

function showShowcase(category = null) {
  document.getElementById('stageView').classList.remove('show');
  document.getElementById('showcaseGrid').classList.remove('hide');
  document.getElementById('showcaseGrid').innerHTML = '';
  
  let items = [];
  if(category) {
    items = categories[category] || [];
  } else {
    Object.values(categories).forEach(cats => items.push(...cats));
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'showcase-card';
    card.innerHTML = `
      <div class="showcase-preview">${item.html}</div>
      <div class="showcase-label">${item.name}</div>
    `;
    card.onclick = () => selectItem(item.name);
    document.getElementById('showcaseGrid').appendChild(card);
  });
}

function selectItem(name) {
  current = Object.values(components).find(c => c.name === name);
  if(!current) return;

  document.getElementById('showcaseGrid').classList.add('hide');
  document.getElementById('stageView').classList.add('show');
  document.getElementById('stageName').textContent = current.name;
  document.getElementById('stageTag').textContent = current.category;

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const active = Array.from(document.querySelectorAll('.nav-item')).find(el => el.textContent.includes(name));
  if(active) active.classList.add('active');

  renderPreview();
  renderSettings();
}

function renderPreview() {
  if(!current) return;
  document.getElementById('previewInner').innerHTML = current.html;
  
  const style = document.createElement('style');
  style.textContent = current.css;
  document.head.appendChild(style);
}

function renderSettings() {
  if(!current) return;

  const tabsDiv = document.getElementById('settingsTabs');
  const panesDiv = document.getElementById('settingsPanes');
  tabsDiv.innerHTML = '';
  panesDiv.innerHTML = '';

  const tabs = ['Text', 'Layout', 'Typo', 'Animation', 'Farbe'];
  
  tabs.forEach((tab, idx) => {
    const tabBtn = document.createElement('div');
    tabBtn.className = `settings-tab ${idx === 0 ? 'active' : ''}`;
    tabBtn.textContent = tab;
    tabBtn.onclick = () => {
      document.querySelectorAll('.settings-tab, .settings-pane').forEach(el => el.classList.remove('active', 'show'));
      tabBtn.classList.add('active');
      pane.classList.add('show');
    };
    tabsDiv.appendChild(tabBtn);

    const pane = document.createElement('div');
    pane.className = `settings-pane ${idx === 0 ? 'show' : ''}`;
    pane.id = `pane-${tab}`;

    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `<label>${tab}</label><input type="text" placeholder="Wert eingeben">`;
    pane.appendChild(row);

    panesDiv.appendChild(pane);
  });
}

// SCALE
document.addEventListener('click', e => {
  if(e.target.classList.contains('scale-btn')) {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('previewInner').style.transform = `scale(${e.target.dataset.scale})`;
  }
});

// BACKGROUND
document.addEventListener('click', e => {
  if(e.target.classList.contains('bg-swatch')) {
    document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('previewArea').style.background = e.target.dataset.bg;
  }
});

// BACK BUTTON
document.getElementById('backBtn').addEventListener('click', () => {
  showShowcase();
});

// INIT
renderNav();
showShowcase();
</script>

</body>
</html>
