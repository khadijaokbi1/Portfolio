<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khadija - Master Component Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 16px;
      --text-md: 18px;
      --text-lg: 24px;
      --text-xl: 42px;
      --text-2xl: 64px;
      --work: "Work Sans", sans-serif;
      --outfit: "Outfit", sans-serif;
      --playfair: "Playfair Display", serif;
      --higuen: "Higuen", "Playfair Display", serif;
      --black: #2d2d2d;
      --off-black: #525252;
      --white: #f5f5f5;
      --darkgreen: #314a51;
      --mint: #56686a;
      --burgundy: #6e3b49;
      --mauve: #b5a19e;
      --accent: #b5a19e;
      --cream: #f7f4ef;
      --panel-bg: #ffffff;
      --panel-soft: #fcfaf8;
      --line: rgba(82, 82, 82, 0.15);
      --line-soft: rgba(82, 82, 82, 0.08);
      --sidebar-w: 360px;
      --settings-w: 340px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--black);
      font-family: var(--work);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--panel-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-header {
      padding: 30px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-header h1 {
      font-family: var(--higuen);
      font-size: 42px;
      letter-spacing: 0.05em;
      color: var(--black);
    }

    .import-tools {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .import-status {
      font-size: 11px;
      color: var(--off-black);
      line-height: 1.35;
    }

    .import-btn {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--burgundy);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      font-family: var(--outfit);
      cursor: pointer;
      text-align: left;
    }
    #pick-libs-btn,
    #pick-libs-input {
      display: none !important;
    }

    .comp-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px;
    }

    .category-block {
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel-bg);
    }

    .category-toggle {
      width: 100%;
      border: 0;
      background: var(--panel-soft);
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: var(--outfit);
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--black);
    }

    .category-toggle.active {
      background: var(--black);
      color: var(--white);
    }

    .category-items {
      padding: 8px;
      display: none;
      border-top: 1px solid var(--line-soft);
    }

    .category-items.open {
      display: block;
    }

    .comp-item {
      padding: 10px 15px;
      margin-bottom: 4px;
      cursor: pointer;
      border-radius: 8px;
      font-size: var(--text-sm);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--black);
      font-weight: 500;
    }

    .comp-item:hover { background: #f6f2ef; }
    .comp-item.active {
      background: var(--burgundy);
      color: var(--white);
      font-weight: 700;
    }

    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel-soft);
    }

    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-image: radial-gradient(#e0e0e0 0.8px, transparent 0.8px);
      background-size: 30px 30px;
      overflow: auto;
    }

    #focus-element-container {
      position: relative;
      transition: all 0.4s var(--ease);
      padding: 50px;
    }

    .control-bar {
      background: var(--panel-bg);
      border-top: 1px solid var(--line);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .copy-group {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-family: var(--outfit);
      font-weight: 600;
      font-size: var(--text-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-html, .btn-css, .btn-js {
      background: var(--panel-soft);
      color: var(--black);
    }
    .btn-html:hover, .btn-css:hover, .btn-js:hover {
      background: #efe9e4;
    }
    .action-btn.success {
      background: #4caf50 !important;
      color: #fff !important;
    }

    .settings-panel {
      width: var(--settings-w);
      background: var(--panel-bg);
      border-left: 1px solid var(--line);
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--off-black);
      font-weight: 700;
    }

    .setting-group input, .setting-group select {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: var(--text-sm);
      font-family: var(--outfit);
      color: var(--black);
      outline: none;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      width: min(1120px, 95vw);
      padding: 18px;
    }

    .showcase-card {
      background: var(--panel-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .showcase-title {
      font-size: var(--text-sm);
      font-family: var(--outfit);
      font-weight: 700;
      color: var(--black);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .showcase-preview {
      flex: 1;
      border: 1px dashed var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .showcase-open {
      border: 0;
      background: var(--darkgreen);
      color: var(--white);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 1280px) {
      :root {
        --sidebar-w: 310px;
        --settings-w: 300px;
      }
      .sidebar-header h1 { font-size: 36px; }
      #focus-element-container { padding: 30px; }
    }

    @media (max-width: 1024px) {
      body {
        flex-wrap: wrap;
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .comp-list {
        max-height: 36vh;
      }
      .stage-container {
        width: 100%;
        min-height: 56vh;
      }
      .settings-panel {
        width: 100%;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .control-bar {
        padding: 14px 18px;
      }
      .showcase-grid {
        width: 100%;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        padding: 10px;
      }
    }

    @media (max-width: 680px) {
      .sidebar-header {
        padding: 16px;
      }
      .sidebar-header h1 {
        font-size: 28px;
      }
      .comp-list {
        padding: 8px 12px 12px;
        max-height: 32vh;
      }
      #focus-element-container {
        padding: 14px;
      }
      .control-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .copy-group {
        width: 100%;
      }
      .action-btn {
        flex: 1;
        justify-content: center;
      }
      .settings-panel {
        padding: 14px;
      }
      .settings-grid {
        grid-template-columns: 1fr;
      }
      .showcase-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Khadija Hub</h1>
      <p style="font-size: 11px; color: var(--accent)">Komponenten Bibliothek</p>
      <div class="import-tools">
        <div class="import-status" id="import-status">Library-Import: wird geladen...</div>
        <button class="import-btn" id="load-json-btn" type="button">components.json laden</button>
        <button class="import-btn" id="export-json-btn" type="button">Aktuelle Komponenten als JSON exportieren</button>
        <input id="load-json-input" type="file" accept=".json,application/json" style="display:none">
        <button class="import-btn" id="pick-libs-btn" type="button">Libraries manuell auswaehlen</button>
        <input id="pick-libs-input" type="file" accept=".html,text/html" multiple style="display:none">
      </div>
    </div>
    <nav class="comp-list" id="comp-list"></nav>
  </aside>

  <main class="stage-container">
    <div class="preview-area">
      <div id="focus-element-container"></div>
    </div>

    <div class="control-bar">
      <div style="font-size: 13px; font-weight: 500">Code kopieren:</div>
      <div class="copy-group">
        <button class="action-btn btn-html" data-copy="html"><span>HTML</span></button>
        <button class="action-btn btn-css" data-copy="css"><span>CSS</span></button>
        <button class="action-btn btn-js" data-copy="js"><span>JS</span></button>
      </div>
    </div>
  </main>

  <aside class="settings-panel">
    <h3 style="font-size: 14px; margin-bottom: 5px">Layout & Text</h3>

    <div class="setting-group">
      <label>Text / Label</label>
      <input type="text" id="set-text" value="Entdecken">
    </div>

    <div class="settings-grid">
      <div class="setting-group">
        <label>Margin Top</label>
        <input type="number" id="set-mt" value="0">
      </div>
      <div class="setting-group">
        <label>Margin Right</label>
        <input type="number" id="set-mr" value="0">
      </div>
      <div class="setting-group">
        <label>Margin Bottom</label>
        <input type="number" id="set-mb" value="0">
      </div>
      <div class="setting-group">
        <label>Margin Left</label>
        <input type="number" id="set-ml" value="0">
      </div>
    </div>

    <div class="settings-grid">
      <div class="setting-group">
        <label>Padding Top</label>
        <input type="number" id="set-pt" value="0">
      </div>
      <div class="setting-group">
        <label>Padding Right</label>
        <input type="number" id="set-pr" value="0">
      </div>
      <div class="setting-group">
        <label>Padding Bottom</label>
        <input type="number" id="set-pb" value="0">
      </div>
      <div class="setting-group">
        <label>Padding Left</label>
        <input type="number" id="set-pl" value="0">
      </div>
    </div>

    <div class="settings-grid">
      <div class="setting-group">
        <label>Offset X (left)</label>
        <input type="number" id="set-x" value="0">
      </div>
      <div class="setting-group">
        <label>Offset Y (top)</label>
        <input type="number" id="set-y" value="0">
      </div>
      <div class="setting-group">
        <label>Breite (px, leer=auto)</label>
        <input type="number" id="set-w" value="">
      </div>
      <div class="setting-group">
        <label>Z-Index</label>
        <input type="number" id="set-zi" value="10">
      </div>
    </div>

    <div class="settings-grid">
      <div class="setting-group">
        <label>Text Align</label>
        <select id="set-align">
          <option value="left">left</option>
          <option value="center" selected>center</option>
          <option value="right">right</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Font Family</label>
        <select id="set-font">
          <option value="inherit">inherit</option>
          <option value="var(--work)">Work Sans</option>
          <option value="var(--outfit)">Outfit</option>
          <option value="var(--playfair)">Playfair</option>
          <option value="var(--higuen)">Higuen</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Font Size (px)</label>
        <input type="number" id="set-fs" value="">
      </div>
      <div class="setting-group">
        <label>Font Weight</label>
        <input type="number" id="set-fw" value="">
      </div>
      <div class="setting-group">
        <label>Letter Spacing (px)</label>
        <input type="number" id="set-ls" value="">
      </div>
      <div class="setting-group">
        <label>Italic</label>
        <select id="set-italic">
          <option value="normal" selected>normal</option>
          <option value="italic">italic</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Animation</label>
        <select id="set-anim">
          <option value="default" selected>default</option>
          <option value="none">none</option>
          <option value="float">float</option>
          <option value="pulse">pulse</option>
        </select>
      </div>
    </div>

    <div style="margin-top: auto; background: #fff8f8; padding: 15px; border-radius: 8px; border: 1px solid #ffecec">
      <p style="font-size: 11px; line-height: 1.45; color: #888">
        <strong>Flow:</strong> Kategorie klicken = Showcase aller Elemente. Element klicken = Detailvorschau + Copy.
      </p>
    </div>
  </aside>

  <script>
  const defaultRegistry = {
    "burger-classic": {
      id: "burger-classic",
      category: "Menue & Burger",
      label: "Classic Burger (B1)",
      name: "Classic Burger (B1)",
      defaultText: "Entdecken",
      html: `<div class="kh-burger-b1" onclick="this.classList.toggle('open')">
  <span></span>
  <span></span>
  <span></span>
</div>`,
      css: `.kh-burger-b1 { width: 30px; height: 20px; position: relative; cursor: pointer; [[CUSTOM]] }
.kh-burger-b1 span { display: block; height: 2px; width: 100%; background: #2a1f1a; position: absolute; transition: .3s cubic-bezier(0.23,1,0.32,1); }
.kh-burger-b1 span:nth-child(1){top:0}.kh-burger-b1 span:nth-child(2){top:9px}.kh-burger-b1 span:nth-child(3){top:18px}
.kh-burger-b1.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.kh-burger-b1.open span:nth-child(2){opacity:0}
.kh-burger-b1.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}`,
      js: ""
    }
  };

  let componentRegistry = { ...defaultRegistry };
  let currentId = Object.keys(componentRegistry)[0] || null;
  let currentCategory = null;
  let previewMode = "element";
  const expandedCategories = new Set();

  function updateImportStatus(message, isError = false) {
    const el = document.getElementById("import-status");
    if (!el) return;
    el.textContent = message;
    el.style.color = isError ? "#9f3d3d" : "#525252";
  }

  function normalizeRegistryPayload(payload) {
    if (!payload) return null;
    const raw = payload.components ? payload.components : payload;
    const out = {};

    const pushItem = (id, item, index = 0) => {
      if (!item || typeof item !== "object") return;
      const safeId = id || item.id || `json-${index + 1}`;
      out[safeId] = {
        id: safeId,
        category: item.category || "JSON",
        label: item.label || item.name || safeId,
        name: item.name || item.label || safeId,
        defaultText: item.defaultText || "Entdecken",
        html: item.html || "",
        css: item.css || "",
        js: item.js || "",
        sourceType: item.sourceType || "json"
      };
    };

    if (Array.isArray(raw)) raw.forEach((item, i) => pushItem(item.id, item, i));
    else if (typeof raw === "object") Object.entries(raw).forEach(([id, item], i) => pushItem(id, item, i));

    return Object.keys(out).length ? out : null;
  }

  function looksLikeCodeDump(value) {
    const s = String(value || "");
    return (
      s.includes("function updatePreview(") ||
      s.includes("document.querySelector") ||
      s.includes("const loadJsonBtn") ||
      s.includes("addEventListener(\"change\"")
    );
  }

  function sanitizeRegistry(registry) {
    const clean = {};
    Object.entries(registry || {}).forEach(([id, comp]) => {
      if (!comp || typeof comp !== "object") return;
      const html = String(comp.html || "").trim();
      if (!html.startsWith("<")) return;
      if (looksLikeCodeDump(html)) return;
      clean[id] = comp;
    });
    return clean;
  }

  function prettifyLabel(comp) {
    const raw = (comp.label || comp.name || comp.id || "Element").trim();
    if (!raw || raw === comp.id) {
      return comp.id.replace(/[-_]/g, " ").replace(/\w/g, (s) => s.toUpperCase());
    }
    return raw
      .replace(/elegant/ig, "Elegant")
      .replace(/cta/ig, "CTA")
      .replace(/cursor/ig, "Cursor")
      .replace(/prevnext/ig, "Prev/Next")
      .replace(/\s+/g, " ")
      .trim();
  }

  function normalizeCategory(cat) {
    const c = (cat || "Unkategorisiert").toLowerCase();
    if (c.includes("cta")) return "CTA";
    if (c.includes("cursor")) return "Cursor";
    if (c.includes("menu style")) return "Menu Styles";
    if (c.includes("burger") || c.includes("menue") || c.includes("menu")) return "Menu & Burger";
    if (c.includes("prev / next") || c.includes("prevnext")) return "Prev/Next";
    if (c.includes("scroll")) return "Scroll Indicators";
    if (c.includes("filler")) return "Filler";
    if (c.includes("decorative") || c.includes("dekor") || c.includes("boxes")) return "Dekoration";
    if (c.includes("button")) return "Buttons";
    if (c.includes("layout")) return "Layout";
    return cat;
  }

  function applyRegistry(registry, sourceName) {
    const safeRegistry = sanitizeRegistry(registry);
    if (!Object.keys(safeRegistry).length) {
      componentRegistry = { ...defaultRegistry };
      currentId = Object.keys(componentRegistry)[0] || null;
      currentCategory = currentId ? componentRegistry[currentId].category : null;
      if (currentCategory) expandedCategories.add(currentCategory);
      previewMode = "element";
      renderSidebar();
      updatePreview();
      updateImportStatus(`Import verworfen (ungueltige Daten) - Default aktiv`, true);
      return;
    }

    componentRegistry = safeRegistry;
    Object.values(componentRegistry).forEach((comp) => {
      comp.category = normalizeCategory(comp.category);
      comp.label = prettifyLabel(comp);
    });
    currentId = Object.keys(componentRegistry)[0] || null;
    currentCategory = currentId ? componentRegistry[currentId].category : null;
    if (currentCategory) expandedCategories.add(currentCategory);
    previewMode = "element";
    renderSidebar();
    updatePreview();
    updateImportStatus(`Komponenten geladen: ${sourceName} (${Object.keys(componentRegistry).length})`);
  }

  function getVal(id) { return document.getElementById(id).value; }
  function px(v) { return v === "" ? "" : `${Number(v || 0)}px`; }

  function getCustomCSS() {
    const lines = [
      `margin: ${px(getVal("set-mt")) || "0px"} ${px(getVal("set-mr")) || "0px"} ${px(getVal("set-mb")) || "0px"} ${px(getVal("set-ml")) || "0px"};`,
      `padding: ${px(getVal("set-pt")) || "0px"} ${px(getVal("set-pr")) || "0px"} ${px(getVal("set-pb")) || "0px"} ${px(getVal("set-pl")) || "0px"};`,
      `z-index: ${getVal("set-zi") || 10};`,
      "display: inline-block;",
      "position: relative;",
      `left: ${px(getVal("set-x")) || "0px"};`,
      `top: ${px(getVal("set-y")) || "0px"};`,
      `text-align: ${getVal("set-align") || "center"};`,
      `font-style: ${getVal("set-italic") || "normal"};`
    ];

    const w = getVal("set-w");
    const fs = getVal("set-fs");
    const fw = getVal("set-fw");
    const ls = getVal("set-ls");
    const ff = getVal("set-font");
    if (w) lines.push(`width: ${Number(w)}px;`);
    if (fs) lines.push(`font-size: ${Number(fs)}px;`);
    if (fw) lines.push(`font-weight: ${Number(fw)};`);
    if (ls) lines.push(`letter-spacing: ${Number(ls)}px;`);
    if (ff && ff !== "inherit") lines.push(`font-family: ${ff};`);

    const anim = getVal("set-anim") || "default";
    if (anim === "none") lines.push("animation: none !important; transition: none !important;");
    if (anim === "float") lines.push("animation: khFloat 3s ease-in-out infinite !important;");
    if (anim === "pulse") lines.push("animation: khPulse 1.8s ease-in-out infinite !important;");

    return lines.join("\n  ");
  }

  function replaceTokens(template, text, customCSS) {
    return (template || "")
      .replace(/\[\[TEXT\]\]/g, text)
      .replace(/\[\[CUSTOM\]\]/g, customCSS);
  }

  function groupedComponents() {
    const groups = {};
    Object.values(componentRegistry).forEach((comp) => {
      if (!groups[comp.category]) groups[comp.category] = [];
      groups[comp.category].push(comp);
    });
    Object.values(groups).forEach((list) => list.sort((a, b) => a.label.localeCompare(b.label, "de")));
    return groups;
  }

  function renderSidebar() {
    const list = document.getElementById("comp-list");
    const groups = groupedComponents();
    list.innerHTML = "";

    Object.keys(groups).sort((a, b) => a.localeCompare(b, "de")).forEach((cat) => {
      const block = document.createElement("div");
      block.className = "category-block";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "category-toggle" + (cat === currentCategory ? " active" : "");
      toggle.innerHTML = `<span>${cat}</span><span>${groups[cat].length}</span>`;
      toggle.addEventListener("click", () => {
        currentCategory = cat;
        previewMode = "category";
        if (expandedCategories.has(cat)) expandedCategories.delete(cat); else expandedCategories.add(cat);
        renderSidebar();
        updatePreview();
      });

      const items = document.createElement("div");
      items.className = "category-items" + (expandedCategories.has(cat) ? " open" : "");
      groups[cat].forEach((comp) => {
        const item = document.createElement("div");
        item.className = "comp-item" + (comp.id === currentId ? " active" : "");
        item.textContent = comp.label;
        item.title = comp.name || comp.label;
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          currentId = comp.id;
          currentCategory = comp.category;
          previewMode = "element";
          expandedCategories.add(comp.category);
          renderSidebar();
          updatePreview();
        });
        items.appendChild(item);
      });

      block.appendChild(toggle);
      block.appendChild(items);
      list.appendChild(block);
    });
  }

  function renderCategoryShowcase(category) {
    const container = document.getElementById("focus-element-container");
    const groups = groupedComponents();
    const comps = groups[category] || [];
    container.innerHTML = "";

    const grid = document.createElement("div");
    grid.className = "showcase-grid";

    comps.forEach((comp) => {
      const card = document.createElement("div");
      card.className = "showcase-card";

      const title = document.createElement("div");
      title.className = "showcase-title";
      title.textContent = comp.label;

      const preview = document.createElement("div");
      preview.className = "showcase-preview";

      const iframe = document.createElement("iframe");
      iframe.style.width = "100%";
      iframe.style.height = "110px";
      iframe.style.border = "0";
      const html = replaceTokens(comp.html, getVal("set-text") || comp.defaultText || "", getCustomCSS());
      const css = replaceTokens(comp.css, getVal("set-text") || comp.defaultText || "", getCustomCSS());
      iframe.srcdoc = `<!doctype html><html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:110px;font-family:var(--work,'Work Sans',sans-serif);} ${css}</style></head><body>${html}</body></html>`;
      preview.appendChild(iframe);

      const openBtn = document.createElement("button");
      openBtn.className = "showcase-open";
      openBtn.textContent = "Element öffnen";
      openBtn.addEventListener("click", () => {
        currentId = comp.id;
        previewMode = "element";
        renderSidebar();
        updatePreview();
      });

      card.appendChild(title);
      card.appendChild(preview);
      card.appendChild(openBtn);
      grid.appendChild(card);
    });

    container.appendChild(grid);
  }

  function updatePreview() {
    if (previewMode === "category" && currentCategory) {
      renderCategoryShowcase(currentCategory);
      return;
    }

    const comp = componentRegistry[currentId];
    if (!comp) return;

    const text = getVal("set-text") || comp.defaultText || "";
    const customCSS = getCustomCSS();
    const html = replaceTokens(comp.html, text, customCSS);
    const css = replaceTokens(comp.css, text, customCSS);

    const container = document.getElementById("focus-element-container");
    container.innerHTML = html;

    let styleTag = document.getElementById("live-styles");
    if (!styleTag) {
      styleTag = document.createElement("style");
      styleTag.id = "live-styles";
      document.head.appendChild(styleTag);
    }
    styleTag.textContent = `@keyframes khFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes khPulse{0%,100%{opacity:1}50%{opacity:.65}}\n${css}`;
  }

  async function copyToClipboard(content) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(content);
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = content;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }

  async function copyPart(type) {
    if (previewMode !== "element") {
      updateImportStatus("Im Kategorie-Showcase erst ein Element öffnen", true);
      return;
    }

    const comp = componentRegistry[currentId];
    if (!comp) return;
    const text = getVal("set-text") || comp.defaultText || "";
    const customCSS = getCustomCSS();

    let content = "";
    if (type === "html") content = replaceTokens(comp.html, text, customCSS);
    if (type === "css") content = replaceTokens(comp.css, text, customCSS);
    if (type === "js") content = comp.js || "// Kein Javascript benoetigt fuer dieses Element.";

    await copyToClipboard(content);
    const btn = document.querySelector(`.btn-${type}`);
    const old = btn.innerHTML;
    btn.innerHTML = "<span>Kopiert! ✓</span>";
    btn.classList.add("success");
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove("success"); }, 1200);
  }

  function exportRegistryAsJson() {
    const payload = { version: 1, components: Object.values(componentRegistry) };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "components.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    updateImportStatus("JSON exportiert");
  }

  async function tryLoadDefaultJson() {
    for (const path of ["./components.json", "./data/components.json"]) {
      try {
        const res = await fetch(path);
        if (!res.ok) continue;
        const payload = await res.json();
        const registry = normalizeRegistryPayload(payload);
        if (!registry) continue;
        applyRegistry(registry, path);
        return true;
      } catch (_) {}
    }
    return false;
  }

  document.querySelectorAll("[data-copy]").forEach((btn) => btn.addEventListener("click", () => copyPart(btn.dataset.copy)));

  const inputIds = ["set-text","set-mt","set-mr","set-mb","set-ml","set-pt","set-pr","set-pb","set-pl","set-x","set-y","set-w","set-zi","set-align","set-font","set-fs","set-fw","set-ls","set-italic","set-anim"];
  inputIds.forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", updatePreview);
    if (el) el.addEventListener("change", updatePreview);
  });

  const loadJsonBtn = document.getElementById("load-json-btn");
  const loadJsonInput = document.getElementById("load-json-input");
  const exportJsonBtn = document.getElementById("export-json-btn");
  const pickLibsBtn = document.getElementById("pick-libs-btn");
  const pickLibsInput = document.getElementById("pick-libs-input");
  if (pickLibsBtn) pickLibsBtn.style.display = "none";
  if (pickLibsInput) pickLibsInput.style.display = "none";

  loadJsonBtn.addEventListener("click", () => loadJsonInput.click());
  loadJsonInput.addEventListener("change", async (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      const registry = normalizeRegistryPayload(payload);
      if (!registry) throw new Error("invalid");
      applyRegistry(registry, file.name);
    } catch (_) {
      updateImportStatus("JSON konnte nicht geladen werden", true);
    }
  });
  exportJsonBtn.addEventListener("click", exportRegistryAsJson);

  (async function init() {
    applyRegistry({ ...defaultRegistry }, "Default");
    const loaded = await tryLoadDefaultJson();
    if (!loaded) updateImportStatus("JSON nicht gefunden - lokale Komponenten aktiv");
  })();
</script>
</body>
</html>
